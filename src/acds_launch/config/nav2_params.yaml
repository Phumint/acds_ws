    - nav2_drive_on_heading_cancel_bt_node




# =====================
# CONTROLLER SERVER
# =====================
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 5.0

    # === ADDED FIXES ===
    # 1. Give the Pi 4 more time to calculate (Fixes "Aborting handle")
    transform_tolerance: 1.0 
    
    # 2. Force output directly to your driver (Bypasses hidden topics)
    cmd_vel_topic: "cmd_vel"
    # ===================

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # === ACKERMANN PURE PURSUIT ===
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      wheelbase: 0.135
      desired_linear_vel: 0.4
      lookahead_dist: 0.4
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_at_start: false
      use_rotate_to_heading_at_start: false
      allow_reversing: false
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: false # WARNING: Turn this to TRUE once wheels spin!
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25


# =====================
# LOCAL COSTMAP
# =====================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 1.0

      transform_tolerance: 1.0  # Add this here too

      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true

      width: 3
      height: 3
      resolution: 0.05

      footprint: "[[0.18, 0.14], [0.18, -0.14], [-0.18, -0.14], [-0.18, 0.14]]"

      plugins: ["inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35


# =====================
# GLOBAL COSTMAP
# =====================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link
      track_unknown_space: true

      resolution: 0.00178253119

      footprint: "[[0.18, 0.14], [0.18, -0.14], [-0.18, -0.14], [-0.18, 0.14]]"

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 0.55


# =====================
# PLANNER SERVER
# =====================
planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 20.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
